spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://payment-db:5432/paymentdb}
    username: ${DATABASE_USERNAME:paymentuser}
    password: ${DATABASE_PASSWORD:paymentpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/payment-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/payment-realm/protocol/openid-connect/certs}

logging:
  level:
    root: INFO
    dev.jstephenperry.webpos: ${LOG_LEVEL:INFO}
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}

payment:
  processor:
    mock-mode: false
